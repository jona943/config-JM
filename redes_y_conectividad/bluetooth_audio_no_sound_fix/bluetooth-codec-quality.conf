# PipeWire Bluetooth Codec Configuration
#
# Copiar este archivo a: ~/.config/pipewire/pipewire-bluez.conf
#
# Este archivo de configuración anula los valores predeterminados de PipeWire para los códecs de Bluetooth.
# El objetivo es forzar la selección de códecs de alta calidad y mejorar la calidad de audio.

context.properties = {
    # Prioriza los códecs en este orden. PipeWire intentará usar el primero de la lista
    # que sea compatible con los auriculares.
    bluez5.codecs = [ "ldac", "aptx_hd", "aptx", "aac", "sbc" ]

    # Configuración específica para cada códec.
    bluez5.ldac.quality = "high"   # Opciones: "high", "standard", "mobile"
    bluez5.aac.bitrate = 44100     # Opciones: 44100, 48000
    
    # Habilita SBC-XQ (calidad extendida) para el códec SBC de respaldo.
    bluez5.sbc.quality = "xq"      # Opciones: "sq", "xq"
    bluez5.sbc.bitpool = 53        # Rango: 16-53 (mayor es mejor)
}
